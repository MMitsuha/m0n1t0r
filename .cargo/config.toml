[alias]
xtask = "run --package xtask --bin xtask --"

[env]
CARGO_WORKSPACE_DIR = { value = "", relative = true }

[target.'cfg(all(target_os="windows", target_env="msvc"))']
rustflags = [
    "-C", "target-feature=+crt-static",
    "-l", "mfuuid",
    "-l", "mfplat",
    "-l", "mf",
    "-l", "strmiids",
    "-l", "mfreadwrite",
    "-C", "link-args=/NODEFAULTLIB:MSVCRT",
    # "-C", "link-args=/DEBUG:NONE"
]
[target.'cfg(target_os="macos")']
rustflags = [
    "-C", "link-args=-sectcreate __CGPreLoginApp __cgpreloginapp /dev/null",
    "-l", "framework=AVFoundation",
    "-l", "framework=AudioToolbox",
    "-l", "framework=CoreAudio",
    "-l", "framework=CoreMedia",
    "-l", "framework=CoreVideo",
    "-l", "framework=CoreFoundation",
    "-l", "framework=CoreGraphics",
    "-l", "framework=CoreServices",
    "-l", "framework=Foundation",
    "-l", "framework=VideoToolbox",
    "-l", "framework=CoreImage",
    "-l", "framework=OpenGL",
    "-l", "framework=AppKit",
    "-l", "framework=Security",
    "-l", "framework=IOKit",
    "-l", "framework=QuartzCore",
    "-l", "iconv",
    "-l", "bz2",
    "-l", "z",
    "-l", "xml2",
]
#[target.'cfg(target_os="linux")']
# glibc-static required, this may fix https://github.com/rustdesk/rustdesk/issues/9103, but I do not want this big change
# this is unlikely to help also, because the other so files still use libc dynamically
#rustflags = [
#    "-C", "link-args=-Wl,-Bstatic -lc -Wl,-Bdynamic"
#]
[net]
git-fetch-with-cli = true
